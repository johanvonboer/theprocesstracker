server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all unmatched paths (/login, /s/<code>, …) serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell, service worker and manifest must always be revalidated,
    # or browsers keep running an old build and never see the update.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Cache immutable hashed assets aggressively
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
}
